<!doctype html>
<html lang="ta">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/logo.png" />
    <link rel="apple-touch-icon" href="/logo.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0" />
    <meta name="theme-color" content="#0d5c46" />
    <meta name="robots" content="index, follow, max-image-preview:large, max-snippet:-1, max-video-preview:-1" />
    <link rel="canonical" href="https://jaykay-homeo-website.pages.dev/" />
    
    <!-- Primary SEO & Social Link Preview Meta Tags -->
    <title>%VITE_CLINIC_OG_TITLE%</title>
    <meta name="title" content="%VITE_CLINIC_OG_TITLE%" />
    <meta name="description" content="%VITE_CLINIC_OG_DESC%" />
    <meta name="keywords" content="%VITE_CLINIC_NAME%, Homeopathy Perundurai, Homeopathy Erode, Dr. J. Vivekananthan, Dr. N. Jayakanthan, Tamil Homeopathy Clinic" />
    <meta name="author" content="%VITE_CLINIC_AUTHOR%" />

    <!-- Open Graph / WhatsApp / Telegram Social Preview Cards -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="%VITE_CLINIC_OG_TITLE%" />
    <meta property="og:description" content="%VITE_CLINIC_OG_DESC%" />
    <meta property="og:image" content="https://jaykay-homeo-website.pages.dev/logo.png" />
    <meta property="og:url" content="https://jaykay-homeo-website.pages.dev/" />
    <meta property="og:site_name" content="%VITE_CLINIC_NAME%" />

    <!-- Fonts: Noto Sans Tamil & Inter -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Noto+Sans+Tamil:wght@400;500;600;700&display=swap" rel="stylesheet">

    <!-- Schema.org MedicalClinic Rich Data -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "MedicalClinic",
      "name": "%VITE_CLINIC_NAME%",
      "image": "https://jaykay-homeo-website.pages.dev/logo.png",
      "logo": "https://jaykay-homeo-website.pages.dev/logo.png",
      "url": "https://jaykay-homeo-website.pages.dev/",
      "description": "%VITE_CLINIC_OG_DESC%",
      "medicalSpecialty": ["Homeopathic", "GeneralMedicine"],
      "priceRange": "₹",
      "currenciesAccepted": "INR",
      "paymentAccepted": "Cash",
      "telephone": ["+919442726598", "+918300948421"],
      "address": {
        "@type": "PostalAddress",
        "streetAddress": "39/24 Ganapathi Nagar, Amma Iyer Kulam Park near, R.S. Road",
        "addressLocality": "Perundurai",
        "addressRegion": "Tamil Nadu",
        "postalCode": "638052",
        "addressCountry": "IN"
      },
      "geo": {
        "@type": "GeoCoordinates",
        "latitude": 11.2741,
        "longitude": 77.5833
      },
      "openingHoursSpecification": {
        "@type": "OpeningHoursSpecification",
        "dayOfWeek": ["Monday", "Tuesday", "Wednesday", "Thursday", "Friday", "Saturday", "Sunday"],
        "opens": "10:00",
        "closes": "17:00"
      }
    }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
